name: CI

on:
  push:
    branches: [main, staging, develop, "feature/**", "fix/**"]
  pull_request:

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test TuckCore
        run: swift test --package-path Packages/TuckCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        # On failure, repeat compiler errors as annotations so they show on the run
        # summary (and in the API) without opening the full log.
        run: |
          set -o pipefail
          xcodebuild -project Tuck.xcodeproj -scheme Tuck \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Tuck.Core
        run: dotnet test tests/Tuck.Core.Tests --configuration Release

      - name: Build app
        run: dotnet build Tuck.Windows.slnx --configuration Release
