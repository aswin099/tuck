name: Release

# Push a version tag (for example `git tag v0.2.0 && git push origin v0.2.0`) to build
# Tuck and create a draft GitHub Release with the downloads. A tag on a commit with the
# Windows folder (feature/windows for now) builds macOS and Windows; any other tag builds
# macOS only. Review the draft on GitHub, then click Publish. Tags with a suffix, such as
# v0.2.0-preview.1, become pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  detect:
    name: Check for the Windows app
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.check.outputs.windows }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: echo "windows=$([ -d Windows ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows downloads
    needs: detect
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Tuck.Core
        run: dotnet test Windows/tests/Tuck.Core.Tests --configuration Release

      - name: Publish single-file Tuck.exe
        shell: bash
        run: >
          dotnet publish Windows/src/Tuck.App --configuration Release
          --runtime win-${{ matrix.arch }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version="${GITHUB_REF_NAME#v}"
          --output publish/${{ matrix.arch }}

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.arch }}/Tuck.exe -DestinationPath Tuck-Windows-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: Tuck-Windows-${{ matrix.arch }}.zip

  macos:
    name: macOS download
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # KeyboardShortcuts 3.x needs Swift 6.2 (Xcode 26+); the runner's default Xcode can be older.
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test TuckCore
        run: swift test --package-path Packages/TuckCore

      - name: Build Tuck.app
        run: |
          brew install xcodegen
          xcodegen generate
          # macOS version numbers only allow digits and dots, so drop a "-preview" suffix here.
          set -o pipefail
          xcodebuild -project Tuck.xcodeproj -scheme Tuck -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="$(echo "${GITHUB_REF_NAME#v}" | cut -d- -f1)" build 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Zip
        run: ditto -c -k --keepParent build/Build/Products/Release/Tuck.app Tuck-macOS.zip

      # The .dmg opens a styled window where you drag Tuck into Applications.
      - name: Make the installer (.dmg)
        run: |
          swift tools/dmg/render-background.swift build/dmg
          tiffutil -cathidpicheck build/dmg/background.png build/dmg/background@2x.png -out build/dmg/background.tiff
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet dmgbuild==1.6.7
          build/venv/bin/dmgbuild -s tools/dmg/settings.py \
            -D app=build/Build/Products/Release/Tuck.app -D background=build/dmg/background.tiff \
            Tuck Tuck-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Tuck-macOS.dmg
            Tuck-macOS.zip

  release:
    name: Draft GitHub Release
    needs: [windows, macos]
    # Runs after a skipped Windows job too, but never after a failed one.
    if: ${{ !cancelled() && needs.macos.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "Tuck $GITHUB_REF_NAME" --generate-notes \
            Tuck-*.dmg Tuck-*.zip
